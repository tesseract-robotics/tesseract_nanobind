[build-system]
requires = [
    "scikit-build-core >=0.11",  # PEP 639 License-Expression / License-File
    "nanobind ==2.12.0",  # exact: committed .pyi stubs are stubgen output of this version (gh-159)
    "setuptools-scm >=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "tesseract-robotics-nanobind"
description = "Python bindings (nanobind) for Tesseract, the ROS-Industrial motion planning framework"
keywords = ["robotics", "motion planning", "kinematics", "collision checking", "trajectory optimization", "tesseract", "trajopt", "ompl"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# One cp312-abi3 wheel per platform (wheel.py-api below) covers 3.12 and up, Rhino 9's CPython 3.13 included.
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "loguru>=0.7.0",
    "scipy>=1.17.1",         # Required for Eigen sparse matrix conversion in nanobind
    "viser>=1.1.1",          # Required for tesseract_robotics.viewer
    "trimesh>=4",            # Required for tesseract_robotics.viewer
    "pillow",                # Required for tesseract_robotics.viewer
    "pyyaml",                # Required for tesseract_robotics.planning (profile_types)
]

authors = [
    { name = "Jelle Feringa", email = "jelle@terrestrial.construction" },
    { name = "John Wason", email = "wason@wasontech.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    # one per operating system wheels.yml publishes a wheel for
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    # "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",  # covered by the cp312-abi3 wheel
    "Programming Language :: Python :: 3.14",  # covered by the cp312-abi3 wheel
    "Programming Language :: Python :: 3.15",  # covered by the cp312-abi3 wheel
    "Programming Language :: C++",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",  # py.typed and the committed .pyi stubs
]
dynamic = ["version", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/tesseract-robotics/tesseract_nanobind"
Repository = "https://github.com/tesseract-robotics/tesseract_nanobind"
Documentation = "https://tesseract-robotics.github.io/tesseract_nanobind/"
Changelog = "https://github.com/tesseract-robotics/tesseract_nanobind/blob/main/CHANGELOG.md"
Issues = "https://github.com/tesseract-robotics/tesseract_nanobind/issues"

[project.scripts]
tesseract_nanobind_selftest = "tesseract_robotics.selftest:main"
tesseract_abb_irb2400_viewer = "tesseract_robotics.examples.abb_irb2400_viewer:main"
tesseract_basic_cartesian_example = "tesseract_robotics.examples.basic_cartesian_example:main"
tesseract_car_seat_example = "tesseract_robotics.examples.car_seat_example:main"
tesseract_chain_example = "tesseract_robotics.examples.chain_example:main"
tesseract_contact_managers_example = "tesseract_robotics.examples.contact_managers_example:main"
tesseract_convex_decomposition_example = "tesseract_robotics.examples.convex_decomposition_example:main"
tesseract_environment_commands_example = "tesseract_robotics.examples.environment_commands_example:main"
tesseract_environment_state_example = "tesseract_robotics.examples.environment_state_example:main"
tesseract_freespace_clearance_objective_example = "tesseract_robotics.examples.freespace_clearance_objective_example:main"
tesseract_freespace_hybrid_example = "tesseract_robotics.examples.freespace_hybrid_example:main"
tesseract_freespace_ompl_example = "tesseract_robotics.examples.freespace_ompl_example:main"
tesseract_geometry_showcase_example = "tesseract_robotics.examples.geometry_showcase_example:main"
tesseract_glass_upright_example = "tesseract_robotics.examples.glass_upright_example:main"
tesseract_kinematics_analysis_example = "tesseract_robotics.examples.kinematics_analysis_example:main"
tesseract_kinematics_plugins_example = "tesseract_robotics.examples.kinematics_plugins_example:main"
tesseract_mesh_roundtrip_example = "tesseract_robotics.examples.mesh_roundtrip_example:main"
tesseract_online_planning_example = "tesseract_robotics.examples.online_planning_example:main"
tesseract_online_planning_sqp_example = "tesseract_robotics.examples.online_planning_sqp_example:main"
tesseract_pointcloud_octree_collision_example = "tesseract_robotics.examples.pointcloud_octree_collision_example:main"
tesseract_pick_and_place_example = "tesseract_robotics.examples.pick_and_place_example:main"
tesseract_pythonic_api_example = "tesseract_robotics.examples.pythonic_api_example:main"
tesseract_plugin_configuration_example = "tesseract_robotics.examples.plugin_configuration_example:main"
tesseract_puzzle_piece_auxillary_axes_example = "tesseract_robotics.examples.puzzle_piece_auxillary_axes_example:main"
tesseract_python_constraints_example = "tesseract_robotics.examples.python_constraints_example:main"
tesseract_raster_example = "tesseract_robotics.examples.raster_example:main"
tesseract_scene_graph_example = "tesseract_robotics.examples.scene_graph_example:main"
tesseract_sdf_collision_example = "tesseract_robotics.examples.sdf_collision_example:main"
tesseract_shapes_viewer = "tesseract_robotics.examples.shapes_viewer:main"
tesseract_state_solver_example = "tesseract_robotics.examples.state_solver_example:main"
tesseract_collision_example = "tesseract_robotics.examples.tesseract_collision_example:main"
tesseract_kinematics_example = "tesseract_robotics.examples.tesseract_kinematics_example:main"
tesseract_material_mesh_viewer = "tesseract_robotics.examples.tesseract_material_mesh_viewer:main"
tesseract_trajectory_collision_example = "tesseract_robotics.examples.trajectory_collision_example:main"
tesseract_twc_workcell_positioner_viewer = "tesseract_robotics.examples.twc_workcell_positioner_viewer:main"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/audit needs libclang, which only the `audit` env has: run it with `pixi run -e audit audit-test`.
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "--ignore=tests/audit"]
# An xfail that starts passing fails the run, so a stale xfail cannot hide.
xfail_strict = true
# A hung planner or a deadlocked thread test must fail the run, not stall it. The longest
# example plans (TrajOptIfopt on a 9-DOF toolpath) take under 2 minutes on a loaded runner;
# a test that needs more, or less, sets `@pytest.mark.timeout(seconds)`.
timeout = 600
timeout_method = "thread"
# Warnings are errors: a warning that surfaces is fixed or filtered below with its reason.
filterwarnings = ["error"]
markers = [
    "viewer: Viewer examples (deselect with '-m \"not viewer\"')",
    "planning: Motion planning examples",
    "basic: Basic examples (collision, kinematics, scene_graph)",
    "lowlevel: Low-level API examples",
]

[tool.scikit-build]
# Required by scikit-build-core for the local support-extra metadata provider.
experimental = true
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/tesseract_robotics"]
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.optional-dependencies]
provider = "support_metadata"
provider-path = "scripts"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
root = "."
tag_regex = "^(?P<version>\\d+\\.\\d+\\.\\d+\\.\\d+(?:rc\\d+)?)$"
# PyPI rejects PEP 440 local-version segments (the "+g<sha>.d<date>" suffix the default
# node-and-date scheme stamps onto a dirty build tree) with HTTP 400. CI wheel jobs can
# dirty the tree (generated .pyi stubs / in-place YAML patches), so without this twine
# aborts mid-batch and fragments the release across platforms (see 0.35.0.2). Force a
# local-free version so every tag build is uploadable.
local_scheme = "no-local-version"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# The PyPI wheels are built by .github/workflows/wheels.yml without conda: the tesseract C++
# stack is built from source with colcon against vcpkg dependencies, and auditwheel,
# delvewheel and scripts/repair_macos_wheel.py bundle it. The pixi envs below are for local development only.

[tool.ty.src]
# Audit fixtures are deliberately broken stubs and sources (unbound names, bad overrides).
exclude = ["tests/audit/fixtures/"]

[tool.ruff]
target-version = "py312"
line-length = 100
# auto-generated stubs have C++ type strings; upstream/ and packaging/ are other projects'
# submodules, linted by their own repos (a checked-out submodule otherwise fails `pixi run lint`)
extend-exclude = ["*.pyi", "upstream/", "packaging/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # errors, pyflakes, isort, pyupgrade
ignore = ["E501"]                       # line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
# nanobind extension modules use star imports - ruff can't see into .so files
"src/tesseract_robotics/*/__init__.py" = ["F403", "F405"]
# examples __init__.py re-export run()/main() entry points for REPL/`python -m` use
"src/tesseract_robotics/examples/**/__init__.py" = ["F401", "F403", "I001"]

[tool.ruff.format]
quote-style = "double"
# ruff 0.17 formats Markdown code blocks too. The docs' python blocks hold pymdownx snippet
# includes (`--8<-- "file:section"`), which it rewrites to `--8 < --"file:section"` and breaks,
# and hand-aligned arrays; the pre-commit hook formats only Python, stubs and notebooks.
exclude = ["*.md"]

# ============================================================================
# Pixi configuration - replaces conda environment.yml
# ============================================================================

[tool.pixi.workspace]
name = "tesseract_robotics_dev"
# The native C++ stack (tesseract, trajopt, tesseract_planning, ... on vcpkg's third-party
# libraries) is not installed from conda: `pixi run native-build` builds it into .native/ with
# scripts/native_stack.py, the script the wheel workflow runs. This env carries the toolchain.
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.12"

# Build tools (scripts/native_stack.py and the bindings build). The compiler is the system's:
# Apple clang, gcc/g++ on Linux, MSVC on Windows.
cmake = ">=3.15,<4"
ninja = "*"
make = "*"
pkg-config = "*"
ccache = "*"
git = "*"  # needed by setuptools-scm for version derivation; CI pixi envs don't see system git

# Python build deps
pip = "*"
setuptools = ">=68,<82"
setuptools-scm = ">=8"
wheel = "*"
scikit-build-core = ">=0.11,<1"
nanobind = "==2.12.0"  # exact: committed .pyi stubs are stubgen output of this version (gh-159)

# Dev/test deps
pytest = ">=7.0"
pytest-xdist = ">=3.0"
pytest-timeout = ">=2.3"
pytest-benchmark = "*"
pyyaml = ">=6.0"  # tests (task composer config fixtures) and scripts/audit_gil.py
ruff = ">=0.8.0"
pre-commit = ">=3.0"

# Tools the vcpkg ports build with (the wheel workflow installs them with brew and apt).
[tool.pixi.target.unix.dependencies]
autoconf = "*"
automake = "*"
autoconf-archive = "*"
libtool = "*"
bison = "*"
flex = "*"

# macOS: Apple clang's OpenMP is an external libomp (scripts/native_stack.py --libomp-prefix).
[tool.pixi.target.osx-arm64.dependencies]
llvm-openmp = "*"

# patchelf: ELF-only (Linux). macOS uses install_name_tool (in base system).
# Windows DLLs have no rpath; delvewheel handles bundling instead.
[tool.pixi.target.linux-64.dependencies]
patchelf = "*"

[tool.pixi.target.linux-aarch64.dependencies]
patchelf = "*"

[tool.pixi.pypi-dependencies]
# Note: tesseract-robotics-nanobind NOT here - use `pixi run install` (pip install -e .)
numpy = ">=2.0"
loguru = ">=0.7.0"
scipy = ">=1.17.1"             # Required for nanobind Eigen sparse matrix conversion

# Type checking
pytest-testmon = ">=2.0"  # PyPI version for pytest>=7 compat

# Build the native stack (scripts/native_stack.py): the same tools the wheel workflow pip-installs.
colcon-common-extensions = "*"
vcs2l = "*"

[tool.pixi.tasks]
check-wheel-sources = { cmd = "python scripts/check_wheel_sources.py", description = "Check wheel sources against upstream development submodules" }
test = { cmd = "python -m pytest tests --ignore=tests/benchmarks -q -n auto", depends-on = [
    "install",
] }
test-benchmark = { cmd = "python -m pytest tests/benchmarks -q", depends-on = [
    "install",
], description = "Run benchmark tests (serial, no xdist)" }
lint = "ruff check ."
fmt = "ruff format ."
native-build = { cmd = "python scripts/native_stack.py all", description = "Build the native C++ stack into .native/<triplet>, exactly as the wheel workflow does (scripts/native_stack.py); skipped when its inputs are unchanged" }
install = { cmd = "python scripts/native_stack.py exec -- pip install -e . --no-build-isolation && python scripts/native_stack.py exec -- pip install packaging/tesseract-robotics-nanobind-support --no-deps --no-build-isolation", depends-on = [
    "native-build",
], description = "Install the bindings (editable) and the support data against .native/<triplet>" }
build = { depends-on = [
    "install",
], description = "Build the native stack if needed, then install the bindings against it" }
ompl-first-path-probe = { cmd = "python scripts/ompl_first_path_probe.py", description = "OMPL path of the clearance example's threshold case against its first path (#362)" }
ompl-seed-report = { cmd = "python scripts/ompl_seed_report.py", description = "Per-seed OMPL/TrajOptIfopt report of the clearance example (#362): JSON and Markdown into build/ompl_seed_report" }
check-changelog = { cmd = "python scripts/check_changelog.py", description = "Check CHANGELOG.md release structure (the Docs workflow runs it too)" }
demo-record = { cmd = "python scripts/demos/record.py", description = "Regenerate the demo recordings into docs/demos/ and update the lock; --only NAME... for some" }
demo-check = { cmd = "python scripts/demos/check.py", description = "Drive every player in site/ in headless Chrome: play, pause, scrub, orbit, no failed demo request; --url for the deployed site, --preview for entries awaiting review" }
demo-posters = { cmd = "python scripts/demos/poster.py", description = "Capture posters in headless Chrome for recordings without one, and add their hashes to the lock; --only NAME... to re-capture" }
docs-dotgraphs = { cmd = "python scripts/generate_pipeline_dotgraphs.py", depends-on = [
    "install",
], description = "Regenerate pipeline DOT graph SVGs embedded in the docs (requires graphviz)" }
stubs = { cmd = "python scripts/generate_stubs.py", depends-on = [
    "install",
], description = "Regenerate the committed .pyi stubs from the built extension modules" }
stubs-check = { cmd = "python scripts/generate_stubs.py --check", description = "Fail if any committed .pyi stub differs from the built extension modules" }

[tool.pixi.target.osx-arm64.tasks]
# Same as above plus the libomp prefix: Apple clang has no OpenMP of its own.
native-build = { cmd = "python scripts/native_stack.py all --libomp-prefix $CONDA_PREFIX", description = "Build the native C++ stack into .native/<triplet>, exactly as the wheel workflow does (scripts/native_stack.py); skipped when its inputs are unchanged" }
install = { cmd = "python scripts/native_stack.py exec --libomp-prefix $CONDA_PREFIX -- pip install -e . --no-build-isolation && python scripts/native_stack.py exec --libomp-prefix $CONDA_PREFIX -- pip install packaging/tesseract-robotics-nanobind-support --no-deps --no-build-isolation", depends-on = [
    "native-build",
], description = "Install the bindings (editable) and the support data against .native/<triplet>" }


# The native stack `pixi run native-build` writes: the default, py312 and py315 envs run the
# bindings built against it.
[tool.pixi.feature.native.target.osx-arm64.activation.env]
TESSERACT_CPP_PREFIX = "$PIXI_PROJECT_ROOT/.native/arm64-osx-dynamic-release/ws/install"

[tool.pixi.feature.native.target.linux-64.activation.env]
TESSERACT_CPP_PREFIX = "$PIXI_PROJECT_ROOT/.native/x64-linux-dynamic-release/ws/install"

# Python 3.12 development env (the PyPI wheels are built without conda, see wheels.yml).
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

# Newest Python: builds the bindings and runs the suite against it. Wheels stay cp312-abi3.
[tool.pixi.feature.py315.dependencies]
python = "3.15.*"
trimesh = ">=4"
pillow = "*"

# Instead of the viewer feature: viser 1.1.1 caps websockets <17, and conda-forge's py315
# websockets starts at 17.1. PyPI has a pure 16.x wheel. Back to the viewer feature once a
# viser release with the <18 cap reaches conda-forge.
[tool.pixi.feature.py315.pypi-dependencies]
viser = ">=1.1.1"

# test-wheel: Python and uv from conda, no C++ stack, and everything else from PyPI through
# `uv pip install`. Nothing here can hide a library missing from the wheel. Conda's numpy can
# pull in llvm-openmp, so only wheel-openmp has it: it's the conda consumer of #136.
[tool.pixi.feature.wheel-test.dependencies]
uv = "*"

[tool.pixi.feature.wheel-py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.wheel-py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.wheel-py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.wheel-py315.dependencies]
python = "3.15.*"

[tool.pixi.feature.wheel-openmp]
platforms = ["osx-arm64"]

[tool.pixi.feature.wheel-openmp.dependencies]
numpy = "*"
scipy = "*"
llvm-openmp = "*"

# Docs: the build reads the committed .pyi stubs through PYTHONPATH=src, exactly like the
# Docs workflow, so this env carries no C++ stack.
[tool.pixi.feature.docs.dependencies]
python = "3.12.*"

[tool.pixi.feature.docs.pypi-dependencies]
zensical = ">=0.0.70"
mkdocstrings = { version = ">=1.0", extras = ["python"] }

[tool.pixi.feature.docs.tasks]
docs = { cmd = "zensical serve --dev-addr=localhost:8000 --open", depends-on = ["demo-players"], env = { PYTHONPATH = "src" }, description = "Live docs server with incremental rebuilds" }
demo-fetch = { cmd = "python scripts/demos/fetch.py", description = "Fetch the published demo files from their release, verified against the lock; --stage DIR names local files by hash for upload" }
demo-check-site = { cmd = "python scripts/demos/check_site.py", description = "Check every demo file the built site references exists; the Docs workflow runs it too" }
demo-players = { cmd = "python scripts/demos/players.py", description = "Generate the player snippets the docs pages include; --preview adds recordings awaiting review" }
docs-build = { cmd = "zensical build --strict", depends-on = ["demo-players"], env = { PYTHONPATH = "src" }, description = "Build static docs to site/ with the same strict check as CI" }

# GIL hotspots (docs/developer/threading.md): py-spy samples the GIL-holding thread of a pytest
# run to find bindings worth adding to scripts/nogil_entry_points.yaml. Part of the default env:
# it profiles the extensions installed there.
# tesseract_robotics.viewer.
[tool.pixi.feature.viewer.dependencies]
viser = ">=1.1.1"
trimesh = ">=4"
pillow = "*"

# Docs figures (scripts/docs_figures): matplotlib renders them from the real library, so it
# lives in the default env beside the bindings. matplotlib-base: no GUI toolkit.
[tool.pixi.feature.figures.dependencies]
matplotlib-base = ">=3.9"

[tool.pixi.feature.figures.tasks]
docs-figures = { cmd = "python -m scripts.docs_figures", description = "Regenerate the docs figures in docs/assets/figures and their lock, from the library (deterministic); NAME... for some" }
docs-figures-check = { cmd = "python -m scripts.docs_figures --check", description = "Regenerate the docs figures into build/ and fail unless they and their inputs match the committed SVGs and figures.lock.json bit for bit" }
docs-figures-measure = { cmd = "python -m scripts.docs_figures --measure", description = "Re-run a measured figure's benchmark (NAME, e.g. planner_comparison) into docs/assets/figures/data/; then run docs-figures" }

[tool.pixi.feature.profile.dependencies]
py-spy = ">=0.4.2"

[tool.pixi.feature.profile.tasks]
gil-hotspots = { cmd = "python scripts/gil_hotspots.py all", description = "Record benchmarks and tests with py-spy --gil (asks for sudo); rank the bindings that hold the GIL (#124)" }

# ty, the type checker of record (pre-push hook and CI: `pixi run typecheck`). Pre-1.0: every release changes
# diagnostics, so the range admits patch builds of one version only.
[tool.pixi.feature.typecheck.dependencies]
ty = ">=0.0.101,<0.0.102"

[tool.pixi.feature.typecheck.tasks]
# --python: the env's interpreter, so the editable package and its numpy/scipy resolve.
typecheck = { cmd = "ty check --python $CONDA_PREFIX src/tesseract_robotics", description = "Type check the package with ty (the checker of record)" }

# Binding API audit (docs/developer/binding-api-audit.md): libclang reads the binding
# TUs, ast reads the committed stubs. Dev-only: never in the default env or the wheel.
[tool.pixi.feature.audit.dependencies]
# libclang Python bindings; pulls libclang 22. Exact build: every python-clang build since
# 2026-08 (h3fd057f_*, incl. all of 23.1.x) is noarch but depends on __glibc/libgcc, so it
# cannot install on macOS or Windows. default_hccd1708_2 is the newest portable build.
python-clang = { version = "==22.1.8", build = "default_hccd1708_2" }
# lib/clang/22/include: the builtin headers (stdarg.h, stddef.h) libclang expects in its
# resource dir; python-clang/libclang do not ship them.
clang-22 = "==22.1.8"
ty = ">=0.0.89,<0.0.90"

[tool.pixi.feature.audit.tasks]
audit-bindings = { cmd = "python scripts/audit_bindings.py", description = "Diff each binding's C++ API against its committed stub; writes docs/developer/binding-api-audit.md" }
audit-gil = { cmd = "python scripts/audit_gil.py", description = "Check every GIL release in the bindings against scripts/nogil_entry_points.yaml (#124)" }
# -o addopts drops the default --ignore=tests/audit; --noconftest skips tests/conftest.py,
# which imports the (uninstalled) extension modules.
audit-test = { cmd = "python -m pytest -o addopts='-ra --strict-markers --tb=short' --noconftest tests/audit -n auto", description = "Contract tests of the binding API audit" }
audit-typecheck = { cmd = "ty check scripts/audit_*.py tests/audit", description = "Type-check the binding API audit scripts and tests" }
audit-telemetry = { cmd = "python scripts/audit_telemetry_report.py", description = "Print each audit step's fact-cache hits and misses and its timed phases (CI, from BINDING_AUDIT_EVENTS logs)" }
audit-cache-prune = { cmd = "python scripts/audit_cache_prune.py", description = "Drop the libclang fact-cache entries a run did not use (CI, before saving the cache)" }

[tool.pixi.environments]
default = { features = ["profile", "viewer", "native", "figures", "typecheck"], solve-group = "default" }
py312 = { features = ["py312", "viewer", "native"], solve-group = "py312" }
py315 = { features = ["py315", "native"], solve-group = "py315" }
wheel-312 = { features = ["wheel-test", "wheel-py312"], no-default-feature = true, solve-group = "wheel-312" }
wheel-313 = { features = ["wheel-test", "wheel-py313"], no-default-feature = true, solve-group = "wheel-313" }
wheel-314 = { features = ["wheel-test", "wheel-py314"], no-default-feature = true, solve-group = "wheel-314" }
wheel-315 = { features = ["wheel-test", "wheel-py315"], no-default-feature = true, solve-group = "wheel-315" }
wheel-openmp = { features = ["wheel-test", "wheel-py312", "wheel-openmp"], no-default-feature = true, solve-group = "wheel-openmp" }
# Own solve group: libclang 22 must not move libcxx/llvm-openmp in the env CI builds wheels from.
audit = { features = ["audit"], solve-group = "audit" }
docs = { features = ["docs"], no-default-feature = true, solve-group = "docs" }
