extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tesseract-robotics
      name: tesseract-robotics on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tesseract-robotics-nanobind/
      name: tesseract-robotics-nanobind on PyPI
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  generator: false

# Internal design records: kept in the repository, not published.
exclude_docs: |
  plans/
  superpowers/
  includes/
  requirements.txt

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/demos.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

