# Demo manifest: every top-level viewer example, published or excluded with a reason.
# `page` is the docs page, under docs/, whose section includes the player.
# `published` means a person has looked at the recording (#379); nothing else sets it.
# A camera is enough for `pixi run demo-record` to record an excluded entry, for review.

[[example]]
module = "car_seat_example"
page = "examples/planning.md"
title = "Car seat"
blurb = "Picks a seat off a conveyor and places it through a car's door opening, on a rail-mounted robot."
status = "published"
floor_size_m = 20.0
[example.camera]
position = [-3.16, 6.85, 4.77]
look_at = [0.81, -0.04, 0.55]
fov_rad = 0.6109

