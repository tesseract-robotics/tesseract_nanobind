# Every binding that releases the GIL, and why (#124). scripts/audit_gil.py fails CI when
# this list and the bindings disagree, in either direction; docs/developer/threading.md
# embeds this file.
#
# module (every TU of its binding: the primary and its parts, audit_ownership.MODULE_PARTS)
#   -> Python class (`module` for module-level functions) -> method: reason
# An entry covers every overload of that name that releases the GIL.
#
# The rule (docs/developer/threading.md): release the GIL only around a call that
#   1. is expensive or blocking (roughly > 50 us, or it can wait), or blocks on a C++ lock that a
#      thread waiting for the GIL can hold;
#   2. runs pure C++: no Python object is created, copied or dropped in the released region
#      (trampolines and the std::function caster re-acquire the GIL themselves);
#   3. does not mutate state Python code typically shares across threads.
# Value types, getters, setters and constructors never qualify.

task_composer:
  TaskComposerFuture:
    wait: >-
      Blocks until the executor finishes. Mandatory, not a speed-up: a Python profile or cost
      running on a worker thread needs the GIL, so holding it here deadlocks.
    waitFor: Blocks for up to `duration`; see wait.
    ready: >-
      Frees the finished runs once this one is done (as wait and waitFor do): dropping the last
      reference to an executor a server replaced joins its workers, which may wait for the GIL in
      a Python log handler. The runs' Python references are dropped before the release.
  TaskComposerNode:
    run: >-
      Runs the node in the calling thread; a graph or pipeline waits for its children on the
      executor's workers, which re-enter Python for Python profiles and log handlers.
  TaskComposerServer:
    loadConfig: >-
      Waits for another thread's loadConfig / addTask / addExecutor on this server (the server
      gate, enter_server), which calls Python (a ResourceLocator) and needs the GIL; a Python
      log handler waits there too, on the delivery thread; frees finished runs first (see
      TaskComposerFuture.ready). The load itself holds the GIL.
    addTask: Waits for another thread's mutation of this server; see loadConfig.
    addExecutor: >-
      Replacing an executor destroys the old one, which joins workers that may wait for the GIL
      in a Python callback; also waits for another thread's mutation (see loadConfig). Other
      server calls wait on the gate while it runs, so no Python thread sees it half done.
    run: >-
      Waits for another thread's mutation of this server, then schedules the task on the worker
      threads (see TaskComposerExecutor.run); frees finished runs first.
    getTask: >-
      Waits for another thread's mutation of this server (see loadConfig); releases nothing when
      none runs.
    hasTask: See getTask.
    getAvailableTasks: See getTask.
    getExecutor: See getTask.
    hasExecutor: See getTask.
    getAvailableExecutors: See getTask.
    getWorkerCount: See getTask.
    getTaskCount: See getTask.
  TaskComposerExecutor:
    run: >-
      Schedules the graph on the worker threads, which re-enter Python for Python profiles;
      the context and node are converted before the release.
  TaskflowTaskComposerExecutor:
    run: Re-exposed TaskComposerExecutor.run; same reason.

motion_planners:
  MotionPlanner:
    solve: Seconds of CPU for OMPL, TrajOpt, TrajOpt-Ifopt and Descartes.
  module:
    contactCheckProgram: Collision-checks every state of a program; pure C++ loop.
    assignCurrentStateAsSeed: >-
      Reads the environment under its lock (see environment.Environment.init).
    formatProgram: See assignCurrentStateAsSeed.
    toToolpath: See assignCurrentStateAsSeed; forward kinematics per waypoint.

motion_planners_simple:
  SimpleMotionPlanner:
    solve: >-
      Interpolates and runs IK for every segment; a Python move profile re-acquires the GIL
      through its trampoline.
  SimplePlannerMoveProfile:
    generate: Interpolation plus IK for one segment, called by the planner in a loop.
  module:
    generateInterpolatedProgram: >-
      Interpolates every segment and solves a state per step: ~0.1 s per call in the tests
      (gil-hotspots). Only reads env.
  # Bound by the template bind_instruction_info, named at its call sites.
  JointGroupInstructionInfo:
    __init__: Reads the environment under its lock (getJointGroup / getKinematicGroup).
  KinematicGroupInstructionInfo:
    __init__: See JointGroupInstructionInfo.__init__.

motion_planners_descartes:
  # Bound once for both scalar types by the template bind_descartes, named at its call sites.
  DescartesMoveProfileD:
    createKinematicGroup: >-
      Reads the environment under its lock (see motion_planners.assignCurrentStateAsSeed) and
      loads the IK plugin.
    createWaypointSampler: >-
      Reads the environment under its lock; a Python override takes the GIL in its trampoline.
    createEdgeEvaluator: See createWaypointSampler.
    createStateEvaluator: See createWaypointSampler.
  DescartesMoveProfileF:
    createKinematicGroup: See DescartesMoveProfileD.createKinematicGroup.
    createWaypointSampler: See DescartesMoveProfileD.createWaypointSampler.
    createEdgeEvaluator: See DescartesMoveProfileD.createEdgeEvaluator.
    createStateEvaluator: See DescartesMoveProfileD.createStateEvaluator.

motion_planners_trajopt_ifopt:
  TrajOptIfoptMoveProfile:
    create: Reads the environment under its lock; checks run with the GIL first.
  TrajOptIfoptCompositeProfile:
    create: See TrajOptIfoptMoveProfile.create.
  module:
    createCollisionConstraints: See TrajOptIfoptMoveProfile.create.

trajopt_ifopt:
  # Bound in the part trajopt_ifopt_collision.cpp.
  SingleTimestepCollisionEvaluator:
    __init__: Reads the environment under its lock (its contact manager).
  LVSDiscreteCollisionEvaluator:
    __init__: See SingleTimestepCollisionEvaluator.__init__.
  LVSContinuousCollisionEvaluator:
    __init__: See SingleTimestepCollisionEvaluator.__init__.

trajopt_sqp:
  TrustRegionSQPSolver:
    solve: Runs the full SQP optimization.

kinematics:
  InverseKinematics:
    calcInvKin: Numerical solvers (TRAC-IK, KDL) iterate until their timeout.
  KinematicGroup:
    calcInvKin: See InverseKinematics.calcInvKin; plus redundant-solution expansion.
  module:
    checkKinematics: FK then IK for every working frame and tip link.

time_parameterization:
  TimeParameterization:
    compute: >-
      TOTG, ISP, constant-TCP and Ruckig scale with trajectory length. Only reads env, so no
      Environment event callback fires inside it.

urdf:
  module:
    parseURDFString: >-
      XML parsing plus mesh loading. A Python ResourceLocator re-acquires the GIL through its
      trampoline.
    parseURDFFile: See parseURDFString.

geometry:
  module:
    writeSignedDistanceFieldVDB: >-
      Encodes the whole grid; the field is discretized first with the GIL held, because a sampler
      may be Python, so the released region is pure C++.
    writeSignedDistanceFieldNVDB: See writeSignedDistanceFieldVDB.
    createMeshFromPath: >-
      File IO plus assimp parsing, like parseURDFFile; milliseconds per mesh (gil-hotspots).
    createConvexMeshFromPath: See createMeshFromPath; plus a convex hull.
    createMeshFromResource: >-
      See createMeshFromPath. A Python Resource re-acquires the GIL through its trampoline, and
      nanobind's shared_ptr deleter for it takes the GIL itself.
    createConvexMeshFromResource: See createMeshFromResource; plus a convex hull.

serialization:
  module:
    environment_to_xml: >-
      Serializes the whole command history under the environment's lock (see
      environment.Environment.init): seconds for a mesh-heavy scene.
    environment_to_binary: See environment_to_xml.
    environment_to_file: See environment_to_xml; the file is written without the GIL too.
    environment_from_xml: >-
      Replays the command history into a new Environment (seconds); it has no callbacks yet.
    environment_from_binary: See environment_from_xml.
    environment_from_file: See environment_from_xml; plus file IO.
    composite_instruction_to_file: File IO on the already serialized text (serialized with the GIL).
    scene_state_to_file: See composite_instruction_to_file.
    task_composer_log_to_file: See composite_instruction_to_file.
    composite_instruction_from_file: File IO, then parsing into a new object no other thread sees.
    scene_state_from_file: See composite_instruction_from_file.
    task_composer_log_from_file: See composite_instruction_from_file.

collision:
  DiscreteContactManager:
    contactTest: Broad and narrow phase over every enabled object; called in loops.
    setCollisionObjectsTransform: >-
      The transform-map overload updates every listed object's broad-phase AABB (gh-241).
  ContinuousContactManager:
    contactTest: See DiscreteContactManager.contactTest; swept volumes are costlier still.
    setCollisionObjectsTransform: See DiscreteContactManager.setCollisionObjectsTransform.
  ConvexDecomposition:
    compute: VHACD convex decomposition takes seconds per mesh.
  module:
    collideImplicitSDF: >-
      Multi-start descent: many distance and gradient evaluations per call. It solves on copies
      of the shapes and config, made with the GIL held and destroyed after it is re-acquired, so
      assigning a shape's members during the call affects only later calls, and the copies keep a
      shape's geometry alive. A Python distance, gradient or field sampler takes the GIL per call.

environment:
  Environment:
    init: >-
      Takes the environment's unique lock and fires event callbacks under its shared lock; a thread
      waiting for that lock with the GIL would deadlock against a Python callback
      (docs/developer/threading.md, Environment event callbacks). Builds the scene: 0.9 s.
    isInitialized: Takes the environment's shared lock; see init.
    reset: See init.
    clear: Takes the environment's unique lock; see init.
    getRevision: See isInitialized.
    getInitRevision: See isInitialized.
    getTimestamp: See isInitialized.
    getCurrentStateTimestamp: See isInitialized.
    getName: See isInitialized.
    setName: See clear.
    getSceneGraph: See isInitialized.
    getState: See isInitialized; the overloads that solve a new state cost a state solve.
    link_transforms_batch: >-
      Forward kinematics over every row of a joint-value array into a buffer allocated before the
      release; validation reads the environment, so it runs inside the release too.
    setState: See init (fires SCENE_STATE_CHANGED).
    addEventCallback: >-
      The registration takes the unique lock; the callable is wrapped first, with the GIL.
    removeEventCallback: See clear.
    clearEventCallbacks: See clear.
    applyCommand: See init; mesh-heavy links build collision geometry for seconds.
    applyCommands: See applyCommand.
    getCommandHistory: See isInitialized.
    getStateSolver: See isInitialized.
    getJointIds: See isInitialized.
    getActiveJointIds: See isInitialized.
    getLinkIds: See isInitialized.
    getActiveLinkIds: See isInitialized.
    getStaticLinkIds: See isInitialized.
    getRootLinkId: See isInitialized.
    getCurrentJointValues: See isInitialized.
    getLinkTransform: See isInitialized.
    getRelativeLinkTransform: See isInitialized.
    getLinkTransforms: See isInitialized.
    getCurrentFloatingJointValues: See isInitialized.
    getJointLimits: See isInitialized.
    getLinkCollisionEnabled: See isInitialized.
    getLinkVisibility: See isInitialized.
    getContactManagersPluginInfo: See isInitialized.
    getLink: See isInitialized.
    getJoint: See isInitialized.
    getGroupNames: See isInitialized.
    getGroupJointIds: See isInitialized.
    getJointGroup: See isInitialized.
    getKinematicGroup: See isInitialized; loads the IK plugin on first use (0.5-0.8 s).
    findTCPOffset: See isInitialized; a Python find-TCP callback takes the GIL itself.
    addFindTCPOffsetCallback: See addEventCallback.
    getDiscreteContactManager: See isInitialized; builds every collision shape on first use.
    getContinuousContactManager: See getDiscreteContactManager.
    setActiveDiscreteContactManager: See clear.
    setActiveContinuousContactManager: See clear.
    clearCachedDiscreteContactManager: See clear.
    clearCachedContinuousContactManager: See clear.
    getAllowedCollisionMatrix: See isInitialized.
    getCollisionMarginData: See isInitialized.
    setResourceLocator: See clear.
    getResourceLocator: See isInitialized.
    getKinematicsInformation: See isInitialized.
    clone: Deep copy under the shared lock (gh-134); see isInitialized.
    bind_value_equality: __eq__ / __ne__ hold a shared lock on the left operand's mutex.
  module:
    checkTrajectory: Collision-checks every state of a trajectory; can run for seconds.
    checkTrajectorySegment: One continuous check; called in loops.
    checkTrajectoryState: One discrete check; called in loops.
    _find_tcp_offset_on_native_thread: >-
      Private test oracle (gh-183): joins a native thread that must take the GIL itself.

common:
  module:
    removeLogRecordHandler: >-
      Mandatory, not a speed-up: upstream waits for the handler's in-flight calls on other threads,
      which need the GIL to run a Python handler, so holding it here deadlocks.
