repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: stage-formatted
        name: stage formatted files
        entry: git add -u
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      # ty, the type checker of record. pixi from PATH, else its default install location.
      - id: typecheck
        name: typecheck (ty)
        entry: sh -c 'PIXI=$(command -v pixi || echo "$HOME/.pixi/bin/pixi"); exec "$PIXI" run typecheck'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]