name: Wheel planning diagnostics
on:
  push:
    branches: [jf/pr394-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v8
      with:
        name: python-wheels-win-x64
        run-id: 42845423395
        repository: tesseract-robotics/tesseract_nanobind
        github-token: ${{ github.token }}
        path: wheels
    - uses: actions/download-artifact@v8
      with:
        name: python-wheels-support-any
        run-id: 42845423395
        repository: tesseract-robotics/tesseract_nanobind
        github-token: ${{ github.token }}
        path: wheels
    - name: install built wheels
      shell: bash
      run: python -m pip install wheels/*.whl pytest pytest-xdist
    - name: trace repeated planning
      run: python scripts/diagnose_wheel_planning.py
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: planning-diagnostics
        path: planning-diagnostics/
  shared-ompl:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v8
      with:
        name: vcpkg-binaries-win-x64
        run-id: 42845423395
        repository: tesseract-robotics/tesseract_nanobind
        github-token: ${{ github.token }}
        path: cache-artifacts/vcpkg
    - name: restore binary dependencies
      shell: bash
      run: python scripts/wheel_cache_archive.py unpack-vcpkg --workspace "$RUNNER_TEMP" --artifact cache-artifacts/vcpkg
    - uses: johnwason/vcpkg-action@v8
      with:
        revision: '2026.10.16'
        pkgs: ompl
        triplet: x64-windows-release
        disable-cache: true
        extra-args: --overlay-ports=${{ github.workspace }}/.github/workflows/vcpkg_overlays_windows
        token: ${{ github.token }}
    - name: verify cross-DLL RNG state
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
        cmake -S scripts/ompl_shared_probe -B probe-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%GITHUB_WORKSPACE%/vcpkg/installed/x64-windows-release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        if %ERRORLEVEL% GEQ 1 exit 1
        cmake --build probe-build
        if %ERRORLEVEL% GEQ 1 exit 1
        set PATH=%GITHUB_WORKSPACE%\vcpkg\installed\x64-windows-release\bin;%PATH%
        probe-build\check_seed.exe
        if %ERRORLEVEL% GEQ 1 exit 1
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: shared-ompl-build-logs
        path: vcpkg/buildtrees/ompl/*.log
