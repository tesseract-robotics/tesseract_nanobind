name: Docs

# No `paths:` filter, on purpose: mkdocstrings reads docstrings from
# src/**/*.py as well as *.pyi, and pymdownx.snippets (base_path ['.', 'docs'])
# can include any file, so the build's inputs are the whole repo. A filter is a
# hand-kept copy of that set; once it drifts, commits stop publishing and the
# site goes stale without any failure. A build takes ~30 s.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r docs/requirements.txt

    - name: Build docs (strict)
      run: PYTHONPATH=src mkdocs build --strict

    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    # Pushes to main and manual runs on main publish; pull requests run on
    # refs/pull/<n>/merge and only build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
