name: Build & Test (Linux)

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/wheels-macos.yml'
      - '.github/workflows/wheels-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/wheels-macos.yml'
      - '.github/workflows/wheels-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      # Tag builds must yield EXACTLY the tag version. A dirty CI tree otherwise makes
      # setuptools_scm guess-next-dev (e.g. 0.35.0.4.dev0) which — local segment stripped —
      # would publish as a stray dev release (see 0.35.0.3). Pin the version on tag builds.
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_TESSERACT_ROBOTICS_NANOBIND: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.10', arch: x64,     runner: ubuntu-22.04 }
          - { python: '3.11', arch: x64,     runner: ubuntu-22.04 }
          - { python: '3.12', arch: x64,     runner: ubuntu-22.04 }
          - { python: '3.12', arch: aarch64, runner: ubuntu-22.04-arm }
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v4
      with:
        path: tesseract_nanobind
        fetch-depth: 0  # setuptools-scm needs tag history for version derivation
    # pixi installs the tesseract C++ libs from the tesseract-robotics conda channel
    # (no more vcstool import / colcon build) — build-wheel links + bundles them.
    - name: setup pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      env:
        PIXI_ENV: py${{ matrix.python == '3.10' && '310' || matrix.python == '3.11' && '311' || '312' }}
      with:
        pixi-version: v0.70.1
        manifest-path: tesseract_nanobind/pyproject.toml
        cache: true
        # Fail loudly if pixi.lock drifts from pyproject.toml instead of silently
        # re-solving: a stale lock froze the mid-eigen-5-migration snapshot that
        # shipped ABI-corrupted wheels (orocos-kdl built against Eigen 3.4 mixed
        # with Eigen-5 tesseract libs → heap corruption in every KDL code path).
        locked: true
        environments: ${{ env.PIXI_ENV }}
        activate-environment: ${{ env.PIXI_ENV }}
    - name: typecheck
      working-directory: tesseract_nanobind
      run: pixi run typecheck
    - name: build wheel
      working-directory: tesseract_nanobind
      run: pixi run build-wheel
    # ABI canary: install the just-built wheel into the pixi env and run the
    # kinematics tests against it. KDL jacobians cross the binding↔lib Eigen
    # boundary, so dep-set ABI rot (the eigen-5 lock incident) aborts here in
    # ~30s instead of surfacing as scattered segfaults in test-wheel 15 min later.
    - name: wheel ABI canary (kinematics)
      working-directory: tesseract_nanobind
      run: |
        pixi run pip install --force-reinstall --no-deps wheelhouse/tesseract*.whl
        pixi run python -m pytest tests/tesseract_kinematics -x -q
    - name: archive wheels
      uses: actions/upload-artifact@v4
      with:
        name: python-${{ matrix.python }}-linux-${{ matrix.arch }}
        path: tesseract_nanobind/wheelhouse/tesseract*.whl
    - name: archive logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-linux-${{ matrix.arch }}-py${{ matrix.python }}
        path: '**/*.log'
        retention-days: 2

  test-wheel:
    needs: build
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.12', wheel: '3.12', arch: x64,   runner: ubuntu-24.04,     continue_on_error: false }
          - { python: '3.12', wheel: '3.12', arch: aarch64, runner: ubuntu-24.04-arm, continue_on_error: false }
          - { python: '3.13', wheel: '3.12', arch: x64,   runner: ubuntu-24.04,     continue_on_error: false }
          - { python: '3.13', wheel: '3.12', arch: aarch64, runner: ubuntu-24.04-arm, continue_on_error: false }
          - { python: '3.14', wheel: '3.12', arch: x64,   runner: ubuntu-24.04,     continue_on_error: true }
          - { python: '3.14', wheel: '3.12', arch: aarch64, runner: ubuntu-24.04-arm, continue_on_error: true }
    steps:
      - uses: actions/checkout@v4
        with:
          path: tesseract_nanobind
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: python-${{ matrix.wheel }}-linux-${{ matrix.arch }}
          path: wheelhouse/
      - name: install wheel in virgin env
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install wheelhouse/tesseract*.whl
      - name: debug libs
        run: |
          source test_env/bin/activate
          PKG_DIR=$(python -c "import tesseract_robotics; from pathlib import Path; print(Path(tesseract_robotics.__file__).parent)")
          echo "Package dir: $PKG_DIR"
          echo "--- .so files in package (count) ---"
          ls "$PKG_DIR"/*.so* 2>/dev/null | wc -l
          echo "--- Plugin factories ---"
          ls -la "$PKG_DIR"/lib*_factories.so 2>/dev/null | head -5 || echo "No plugin factories"
          echo "--- Missing deps in any lib ---"
          for so in "$PKG_DIR"/*.so*; do
            missing=$(ldd "$so" 2>&1 | grep "not found" || true)
            if [[ -n "$missing" ]]; then
              echo "$(basename $so): $missing"
            fi
          done
          echo "--- End missing deps check ---"
      - name: smoke test
        run: |
          source test_env/bin/activate
          python -c "import tesseract_robotics; print('Version:', tesseract_robotics.__version__)"
          python -c "from tesseract_robotics import tesseract_common, tesseract_geometry, tesseract_scene_graph"
      - name: dual-libstdc++ regression guard
        # gh-119: bundling libstdc++ put two copies in every numpy-importing
        # process (numpy -> system copy, our libs -> bundled copy); their
        # STB_GNU_UNIQUE locale statics unified across copies and std::regex
        # corrupted the heap in env.init. Guards: (1) the wheel ships no
        # libstdc++, (2) exactly one copy is mapped at runtime, (3) the
        # minimal numpy-first env.init + jacobian path runs clean. Explicit
        # ordered del until the gh-72 keep_alive teardown fix (#118) lands.
        run: |
          source test_env/bin/activate
          PKG_DIR=$(python -c "import tesseract_robotics; from pathlib import Path; print(Path(tesseract_robotics.__file__).parent)")
          if ls "$PKG_DIR"/libstdc++.so* 2>/dev/null; then
            echo "::error::wheel bundles libstdc++ — gh-119 regression"; exit 1
          fi
          python -u - <<'EOF'
          import numpy as np  # numpy first: pulls the system libstdc++ — the gh-119 trigger
          from tesseract_robotics.tesseract_common import FilesystemPath, GeneralResourceLocator
          from tesseract_robotics.tesseract_environment import Environment
          maps = sorted({ln.split()[-1] for ln in open("/proc/self/maps") if "libstdc++" in ln and "r-xp" in ln})
          print("libstdc++ copies:", maps)
          assert len(maps) == 1, f"dual libstdc++ in process: {maps}"
          locator = GeneralResourceLocator()
          urdf = locator.locateResource("package://tesseract/support/urdf/abb_irb2400.urdf").getFilePath()
          srdf = locator.locateResource("package://tesseract/support/urdf/abb_irb2400.srdf").getFilePath()
          env = Environment()
          assert env.init(FilesystemPath(urdf), FilesystemPath(srdf), locator)
          kg = env.getKinematicGroup("manipulator")
          J = kg.calcJacobian(np.array([0.0, 0.0, 0.5, 0.0, 0.5, 0.0]), "tool0")
          print("OK:", J.shape)
          del J, kg, env
          EOF
      - name: run full tests
        run: |
          source test_env/bin/activate
          pip install pytest pytest-xdist scipy
          cd tesseract_nanobind
          pytest tests -n auto \
            --ignore=tests/benchmarks \
            -v --tb=short

  publish:
    needs: [build, test-wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: linux
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: python-*-linux-*
        merge-multiple: true
        path: dist/
    - name: List wheels
      run: ls -la dist/
    - name: assert wheel version == tag (block stray dev/mismatched release)
      run: |
        for whl in dist/*.whl; do
          v=$(basename "$whl" | cut -d- -f2)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::$whl is version $v, expected tag $GITHUB_REF_NAME — refusing to publish"; exit 1; }
        done
        echo "✓ all wheels are version $GITHUB_REF_NAME"
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true  # idempotent re-runs: skip already-uploaded wheels instead of 400-aborting the batch
