name: Binding audit

# Runs on a merge into main and on tags only, never on pull requests: a run takes up to an hour,
# and nearly every binding PR touches its inputs. So nothing here is enforced before merge: a PR's
# unledgered rows, stale report or failing contract test show up on main after it lands, before a
# release. workflow_dispatch runs it on a branch by hand. The full audit is computed once, last:
# contract tests without the ledger row test, the GIL list, then the one audit pass, whose findings
# the ledger test reads and whose report is compared with the committed one.
on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Longest successful run 64 min; a hung job otherwise holds a runner for 6 h.
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4

    - name: setup pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      with:
        pixi-version: v0.70.1
        # Explicit, as in the wheel workflows: without it setup-pixi v0.8.0 auto-detects
        # the manifest by parsing pyproject.toml with a TOML parser that predates dotted
        # keys and fails on `wheel.py-api = ...` (tool.scikit-build).
        manifest-path: pyproject.toml
        environments: audit
        cache: true
        # Same rule as the wheel workflows: a lock that drifts from pyproject.toml fails
        # here instead of silently re-solving to other header versions.
        locked: true

    # What libclang extracted on earlier runs (scripts/audit_cache.py): each entry is keyed on
    # the content of every file its parse read, so a restored entry answers only where nothing
    # it reads changed; everything else is parsed again. The newest earlier cache is restored.
    - name: Restore the fact cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/binding-audit
        key: binding-audit-facts-${{ github.run_id }}
        restore-keys: binding-audit-facts-

    # Entries used after this stamp survive the prune below. The event logs (one per step,
    # scripts/audit_telemetry.py) live outside the cache directory: they are this run's only.
    - name: Stamp the run start
      id: stamp
      run: |
        touch "$RUNNER_TEMP/audit-start"
        mkdir "$RUNNER_TEMP/audit-events"

    # tests/audit (fixtures and the real binding TUs): the contract tests of the audit. The ledger
    # row test audits every module, so it runs below on the one audit pass instead.
    - name: Contract tests
      env:
        BINDING_AUDIT_EVENTS: ${{ runner.temp }}/audit-events/1-tests.jsonl
      run: >-
        pixi run -e audit audit-test
        --deselect
        'tests/audit/test_audit_ledger.py::test_every_open_row_has_an_outcome_and_every_entry_a_row'

    # Every GIL release is listed, with its reason, in scripts/nogil_entry_points.yaml, and
    # every listed entry point still releases it (#124; docs/developer/threading.md).
    - name: GIL releases match the list
      env:
        BINDING_AUDIT_EVENTS: ${{ runner.temp }}/audit-events/2-gil.jsonl
      run: pixi run -e audit audit-gil

    # The one audit pass: writes the report and, for the next step, the findings.
    - name: Audit
      id: audit
      env:
        BINDING_AUDIT_EVENTS: ${{ runner.temp }}/audit-events/3-audit.jsonl
      run: pixi run -e audit audit-bindings --json "$RUNNER_TEMP/binding-audit.json"

    # Missing outcomes and stale entries in one message: the whole debt, not half of it.
    - name: Every open row has an outcome, every entry a row
      env:
        BINDING_AUDIT_JSON: ${{ runner.temp }}/binding-audit.json
        BINDING_AUDIT_EVENTS: ${{ runner.temp }}/audit-events/4-ledger.jsonl
      run: >-
        pixi run -e audit python -m pytest -o addopts='-ra --strict-markers --tb=short'
        --noconftest
        'tests/audit/test_audit_ledger.py::test_every_open_row_has_an_outcome_and_every_entry_a_row'

    # The committed report must be what the audit generates from this tree. The provenance
    # line carries the stubs' last-commit SHA, which the committed report cannot know (a merge
    # or rebase rewrites it), so that one line is ignored (git diff -I, git >= 2.30); every row
    # is compared. Runs after a ledger failure too, so one run shows both. Only after the audit:
    # with no regenerated report the diff would compare the committed one with itself and pass.
    - name: Report is current
      if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
      run: git diff --exit-code -I '^tesseract-robotics `' -- docs/developer/binding-api-audit.md

    # Only after a run that reached every step: a failed run used only part of the cache.
    - name: Drop the facts this run did not use
      if: ${{ success() }}
      run: pixi run -e audit audit-cache-prune .cache/binding-audit "$RUNNER_TEMP/audit-start"

    # Also after a failed step: the facts it computed are as valid as a passing run's.
    - name: Save the fact cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: .cache/binding-audit
        key: binding-audit-facts-${{ github.run_id }}

    # Per step: hits and misses per fact kind, extraction and lock-wait seconds, and the
    # seconds of each uncached phase. Also after a failed step: its numbers explain it. Last,
    # so a log it cannot read costs neither the prune nor the save; not when the job failed
    # before the stamp step made the directory (that failure is the one to read).
    - name: Fact cache use
      if: ${{ !cancelled() && steps.stamp.outcome == 'success' }}
      run: pixi run -e audit audit-telemetry "$RUNNER_TEMP/audit-events"
